name: Release tagged build

on:
  workflow_dispatch:  # 手动触发
    inputs:
      tag_name:
        description: '要发布的标签（如 v1.0.0）'
        required: true
        type: string
      draft:
        description: '是否创建为草稿'
        required: false
        type: boolean
        default: false
      prerelease:
        description: '是否标记为预发布版'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-tags:
    uses: GTNewHorizons/GTNH-Actions-Workflows/.github/workflows/release-tags.yml@master
    with:
      tag_name: ${{ github.event.inputs.tag_name }}
      draft: ${{ github.event.inputs.draft }}
      prerelease: ${{ github.event.inputs.prerelease }}
    secrets: inherit
