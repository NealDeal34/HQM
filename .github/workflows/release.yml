# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Release tagged build

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      version_override:
        description: '要发布的版本（可选，如果指定则必须已存在的标签）'
        required: false
        type: string
        default: ''
      use_current_commit:
        description: '使用当前分支的最新提交而不是标签'
        required: false
        default: true
        type: boolean
      workspace_input:
        description: 'Gradle 工作空间设置'
        required: false
        default: "setupCIWorkspace"
        type: choice
        options:
          - setupCIWorkspace
          - setupDecompWorkspace
  
  # 标签推送触发
  push:
    tags:
      - '*'
  
  # 可重用工作流
  workflow_call:
    secrets:
      MAVEN_USER:
        required: false
      MAVEN_PASSWORD:
        required: false
      CURSEFORGE_TOKEN:
        required: false
      MODRINTH_TOKEN:
        required: false
    inputs:
      workspace:
        description: 'setupCIWorkspace/setupDecompWorkspace'
        required: false
        default: "setupCIWorkspace"
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # 如果是手动触发且有版本输入，使用输入值；否则使用标签或当前分支
      VERSION: ${{ github.event_name == 'workflow_dispatch' && (inputs.version_override != '' && inputs.version_override || 'manual-build-' + github.sha) || github.ref_name }}
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && (inputs.version_override != '' && inputs.version_override || 'manual-build-' + github.sha) || github.ref_name }}
      SNAPSHOT: ${{ endsWith(github.event_name == 'workflow_dispatch' && (inputs.version_override != '' && inputs.version_override || github.ref_name), '-snapshot') || contains(github.event.head_commit.message, '[snapshot]') }}
      PRERELEASE: ${{ endsWith(github.event_name == 'workflow_dispatch' && (inputs.version_override != '' && inputs.version_override || github.ref_name), '-pre') }}
      WORKSPACE_SETTING: ${{ github.event_name == 'workflow_dispatch' && inputs.workspace_input || inputs.workspace || 'setupCIWorkspace' }}
      MAVEN_PUBLISHING_URL: ${{ vars.MAVEN_PUBLISHING_URL || 'https://nexus.gtnewhorizons.com/repository/releases/' }}
    steps:
      - name: Debug info
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Version override: ${{ inputs.version_override }}"
          echo "Use current commit: ${{ inputs.use_current_commit }}"
          echo "GitHub ref: ${{ github.ref }}"
          echo "GitHub ref_name: ${{ github.ref_name }}"
          echo "GitHub sha: ${{ github.sha }}"
          echo "Calculated VERSION: ${{ env.VERSION }}"

      - name: Checkout mod repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 32
          submodules: recursive
          # 如果是手动触发且有指定标签，检查标签；否则检查当前分支
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version_override != '' && inputs.version_override || github.ref }}
      
      - name: Verify checkout
        run: |
          echo "当前所在分支/标签:"
          git describe --tags --always || echo "无法描述标签"
          echo "当前提交:"
          git log --oneline -1
          echo "所有标签:"
          git tag --list || echo "无标签"
          echo "所有远程标签:"
          git ls-remote --tags origin || echo "无法获取远程标签"

      - name: Determine JDK versions
        id: list-jdk-versions
        shell: bash
        run: |
          (
            echo 'java-versions<<EOF'
            echo 8
            echo 17
            echo 21
            if [[ -f gradle/gradle-daemon-jvm.properties ]]; then
              yq -pprops -oprops '.toolchainVersion' gradle/gradle-daemon-jvm.properties
            fi
            echo EOF
          ) | tee -a "${GITHUB_OUTPUT}"

      - name: Set up JDK versions
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.list-jdk-versions.outputs.java-versions }}
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"
          validate-wrappers: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup the workspace
        run: ./gradlew --build-cache --info --stacktrace -PmavenPublishUrl='${{ env.MAVEN_PUBLISHING_URL }}' ${{ env.WORKSPACE_SETTING }}

      - name: Build the mod
        run: ./gradlew --build-cache --info --stacktrace -PmavenPublishUrl='${{ env.MAVEN_PUBLISHING_URL }}' assemble

      # Continue on error in the following steps to make sure releases still get made even if one of the methods fails

      - name: Check if tag exists
        id: check_tag
        if: github.event_name == 'workflow_dispatch' && inputs.version_override != ''
        run: |
          if git rev-parse "refs/tags/${{ inputs.version_override }}" >/dev/null 2>&1; then
            echo "Tag ${{ inputs.version_override }} exists locally"
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag ${{ inputs.version_override }} does not exist locally"
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Delete old release if it already exists
        if: github.event_name == 'workflow_dispatch' && inputs.version_override != '' && steps.check_tag.outputs.tag_exists == 'true'
        run: |
          gh release delete --yes "${{ env.RELEASE_VERSION }}"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release under current tag
        if: github.event_name == 'workflow_dispatch' && inputs.version_override != '' && steps.check_tag.outputs.tag_exists == 'true'
        run: |
          PRERELEASE_FLAG=""
          if [[ "$SNAPSHOT" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          CHANGELOG_OVERRIDE=".changelogs/${RELEASE_VERSION}.md"
          if [[ -f "$CHANGELOG_OVERRIDE" ]]; then
            echo "Using changelog override: $CHANGELOG_OVERRIDE"
            export "CHANGELOG_FILE=$CHANGELOG_OVERRIDE"
            echo "CHANGELOG_FILE=${CHANGELOG_FILE}" >> $GITHUB_ENV
          else
            echo "Generating changelog notes..."
            export "CHANGELOG_FILE=$(mktemp --suffix=.md)"
            echo "CHANGELOG_FILE=${CHANGELOG_FILE}" >> $GITHUB_ENV
            gh api --method POST -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${RELEASE_VERSION}" \
              --jq ".body" > "${CHANGELOG_FILE}"
          fi
          cat "${CHANGELOG_FILE}"
          gh release create "${RELEASE_VERSION}" -F "${CHANGELOG_FILE}" ${PRERELEASE_FLAG} ./build/libs/*.jar
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build successful (manual without tag)
        if: github.event_name == 'workflow_dispatch' && (inputs.version_override == '' || steps.check_tag.outputs.tag_exists != 'true')
        run: |
          echo "Build completed successfully!"
          echo "Built artifacts:"
          ls -la ./build/libs/*.jar
          echo "To create a release, you need to:"
          echo "1. Create a tag: git tag v1.0.0"
          echo "2. Push the tag: git push origin v1.0.0"
          echo "3. Rerun this workflow with the tag name"

      - name: Publish to Maven
        run: ./gradlew --build-cache --info --stacktrace -PmavenPublishUrl='${{ env.MAVEN_PUBLISHING_URL }}' assemble publish -x test
        continue-on-error: true
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        if: ${{ env.MAVEN_USER != '' }}

      - name: Publish to Modrinth
        run: ./gradlew --build-cache --info --stacktrace -PmavenPublishUrl='${{ env.MAVEN_PUBLISHING_URL }}' assemble publish -x test
        continue-on-error: true
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        if: ${{ env.SNAPSHOT != 'true' && env.PRERELEASE != 'true' }}

      - name: Publish to Curseforge
        run: ./gradlew --build-cache --info --stacktrace -PmavenPublishUrl='${{ env.MAVEN_PUBLISHING_URL }}' assemble publish -x test
        continue-on-error: true
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        if: ${{ env.SNAPSHOT != 'true' && env.PRERELEASE != 'true' }}
